<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Kelompok</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* NAVBAR */
        nav {
            background: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #ddd;
        }

        /* HOME */
        .home {
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: white;
        }

        .home h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .home p {
            font-size: 18px;
            color: #666;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 15px;
            }

            .home h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>Website Kelompok</h2>

        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#produk">Produk</a></li>
            <li><a href="#kontak">Kontak</a></li>
        </ul>
    </nav>

    <section class="home" id="home">

        <div>
            <h1>Selamat Datang</h1>

            <p>
                Website ini dibuat secara kolaboratif
                menggunakan Git dan GitHub.
            </p>
        </div>

    </section>

</body>
</html>
